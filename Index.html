<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERPOL Contact Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(135deg, #0a1a3a 0%, #0c2d5e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .interpol-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .interpol-logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .interpol-logo span {
            color: #ff5252;
        }

        .interpol-header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 10px;
            color: #e0e0e0;
        }

        .form-container {
            background: rgba(10, 26, 58, 0.85);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px;
            position: relative;
        }

        .form-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            opacity: 0.15;
            z-index: -1;
        }

        .form-header {
            margin-bottom: 30px;
            text-align: center;
        }

        .form-header h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }

        .form-header p {
            font-size: 1.1rem;
            color: #b0c4de;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #b0c4de;
            font-size: 1.1rem;
        }

        .form-control {
            width: 100%;
            padding: 16px 20px;
            background: rgba(15, 35, 75, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            color: #fff;
            font-family: 'Open Sans', sans-serif;
        }

        .form-control::placeholder {
            color: #8a9bb8;
        }

        .form-control:focus {
            border-color: #ff5252;
            outline: none;
            background: rgba(20, 45, 90, 0.9);
            box-shadow: 0 0 0 3px rgba(255, 82, 82, 0.2);
        }

        .message-group {
            grid-column: span 2;
        }

        textarea.form-control {
            min-height: 180px;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(to right, #ff5252, #e53935);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 30px auto 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(229, 57, 53, 0.4);
            font-family: 'Montserrat', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(229, 57, 53, 0.6);
            background: linear-gradient(to right, #ff6b6b, #ff5252);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn i {
            margin-left: 10px;
        }

        .form-footer {
            margin-top: 40px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-footer p {
            color: #8a9bb8;
            font-size: 0.95rem;
        }

        .security-info {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 15px;
        }

        .security-info i {
            color: #4caf50;
            margin-right: 10px;
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .message-group {
                grid-column: span 1;
            }
            
            .form-container {
                padding: 30px 20px;
            }
            
            .interpol-logo {
                font-size: 2.8rem;
            }
            
            .form-header h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="interpol-header">
            <div class="interpol-logo">INTER<span>POL</span></div>
            <h1>International Criminal Police Organization</h1>
        </div>
        
        <div class="form-container">
            <div class="form-header">
                <h2>Contact INTERPOL</h2>
                <p>For urgent matters, please contact your national INTERPOL office directly. For general inquiries, use the form below.</p>
            </div>
            
            <form action="https://formspree.io/f/mkgznqqr" method="POST" id="contactForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address" required>
                    </div>
                    
                    <div class="form-group message-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" class="form-control" placeholder="Type your message..." required></textarea>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Send Message <i class="fas fa-paper-plane"></i></button>
            </form>
            
            <div class="form-footer">
                <div class="security-info">
                    <i class="fas fa-lock"></i>
                    <p>All communications are encrypted and secure</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('contactForm');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Simple validation
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const message = document.getElementById('message').value;
                
                if (name && email && message) {
                    // Form is valid - show a confirmation
                    const submitBtn = document.querySelector('.submit-btn');
                    const originalText = submitBtn.innerHTML;
                    
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
                    submitBtn.disabled = true;
                    
                    // Simulate form submission
                    setTimeout(() => {
                        // In a real scenario, this would be the form.submit() call
                        // For demo purposes, we'll show a success message
                        submitBtn.innerHTML = '<i class="fas fa-check"></i> Message Sent!';
                        submitBtn.style.background = '#4caf50';
                        
                        // Reset after 3 seconds
                        setTimeout(() => {
                            submitBtn.innerHTML = originalText;
                            submitBtn.disabled = false;
                            submitBtn.style.background = 'linear-gradient(to right, #ff5252, #e53935)';
                            form.reset();
                        }, 3000);
                    }, 1500);
                } else {
                    alert('Please fill in all required fields.');
                }
            });
        });
    </script>
</body>
</html>
